body: |-
  ## Scope
  
  This specification governs source inclusion for referrer, HTTP request, navigation, cookie, storage, caching, structured-field, and well-known URI context targets in `pack:url-query-attribution-foundations`.
  
  ## Requirements
  
  - The pack MUST include RFC 9110 when downstream attribution behavior depends on HTTP request or response semantics.
  - The pack MUST include W3C Referrer Policy for referrer availability, reduction, omission, and suppression.
  - The pack MUST include WHATWG Fetch and WHATWG HTML navigation/referrer integration for browser-controlled request and navigation attribution context.
  - The pack MUST include RFC 6265 and draft-ietf-httpbis-rfc6265bis for cookie-backed attribution state context.
  - The pack MUST include Web Storage for localStorage and sessionStorage attribution state context.
  - The pack MUST include RFC 9111 when caching can affect attribution observability.
  - The pack MAY include RFC 8941 and RFC 8615 only as metadata support mechanisms, not as campaign semantics authorities.
  
  ## Evidence Expectations
  
  - Context templates must distinguish observed absence from parser failure.
  - Context templates must state whether a target governs capture, preservation, validation, classification support, or optional metadata discovery.
  - Context templates must not assert consent, privacy-law, or identity-governance coverage.
