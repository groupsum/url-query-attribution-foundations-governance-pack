  "body": "## Primary Targets\n\n- GA4 traffic-source dimensions, manual tagging, and auto-tagging\n\n## Scope\n\n- Governs:\n  - GA4 manual traffic-source mapping from campaign parameters\n  - Source, medium, campaign, content, term, and campaign ID attribution fields\n  - Traceability from captured parameters to traffic-source outputs\n- Excludes:\n  - GA4 Measurement Protocol payload validation\n  - GA4 BigQuery export schema\n  - Google Ads auto-tagging conversion upload behavior\n\n## Requirements\n\n- Implementations MUST identify which captured campaign fields are mapped into GA4 traffic-source concepts.\n- Implementations MUST keep raw captured campaign values traceable to any normalized GA4 traffic-source output.\n- Implementations MUST document precedence when both manual campaign parameters and other traffic-source context are available.\n- Implementations MUST not claim full GA4 conformance from traffic-source mapping alone.\n\n## Evidence Expectations\n\n- Fixture inputs containing manual campaign parameters.\n- Expected traffic-source mapping output for each governed field.\n- Trace output linking raw query capture to normalized classification fields.\n",
