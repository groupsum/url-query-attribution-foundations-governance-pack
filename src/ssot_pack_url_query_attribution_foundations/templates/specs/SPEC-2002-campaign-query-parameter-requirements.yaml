  "references": [],
  "body": "## Primary Targets\n\n- Google Analytics: Collect campaign data with custom URLs\n\n## Scope\n\n- Governs:\n  - UTM campaign parameter recognition\n  - Campaign parameter field mapping\n  - Required and optional campaign parameter evidence\n- Excludes:\n  - Google tag runtime commands\n  - GA4 event ingestion\n  - Ad click identifier upload APIs\n\n## Requirements\n\n- Implementations MUST recognize utm_source, utm_medium, utm_campaign, utm_id, utm_term, and utm_content when those fields are in downstream scope.\n- Implementations MUST keep campaign parameter semantic mapping separate from URL parser validity.\n- Implementations MUST define how duplicate campaign parameters, empty campaign values, missing campaign values, and unknown query parameters are handled.\n- Implementations SHOULD preserve non-campaign query parameters unless a downstream filtering requirement explicitly removes them.\n\n## Evidence Expectations\n\n- Fixture URLs containing each governed campaign parameter.\n- Mapping output from query parameters to downstream campaign fields.\n- Negative fixtures covering absent, duplicate, empty, and unknown query members.\n",
