  "body": "## Primary Targets\n\n- WHATWG Fetch\n- WHATWG HTML navigation and referrer integration\n\n## Scope\n\n- Governs:\n  - Browser fetch and navigation context relevant to landing-page attribution\n  - Navigation, redirect, credentials, and referrer interactions where used downstream\n  - Client-side attribution context capture boundaries\n- Excludes:\n  - Application routing policy\n  - Analytics SDK event APIs\n  - Server-only HTTP parsing behavior\n\n## Requirements\n\n- Implementations MUST distinguish browser navigation context from server-observed HTTP request context.\n- Implementations MUST document how redirects, client-side navigation, and referrer integration affect attribution context when those behaviors are in downstream scope.\n- Implementations MUST keep URL parsing evidence separate from browser navigation evidence.\n- Implementations SHOULD test both initial page navigation and subsequent client-side navigation when both can affect attribution capture.\n\n## Evidence Expectations\n\n- Browser or simulated browser fixtures for landing-page navigation and redirect behavior.\n- Evidence showing captured URL, referrer, and navigation context.\n- Negative cases for unavailable browser context or unsupported client-side navigation capture.\n",
