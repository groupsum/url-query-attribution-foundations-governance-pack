  "references": [],
  "body": "## Primary Targets\n\n- RFC 8941: Structured Field Values for HTTP\n\n## Scope\n\n- Governs:\n  - Attribution metadata represented with structured HTTP field values\n  - Structured field parsing, serialization, malformed field handling, and evidence\n  - Declared consume, emit, preserve, or validate behavior\n- Excludes:\n  - Defining new permanent HTTP field registrations\n  - Campaign query parameter semantics\n  - GA4 event schema governance\n\n## Requirements\n\n- Implementations MUST use RFC 8941 parsing and serialization rules for attribution metadata represented as structured HTTP fields.\n- Implementations MUST declare whether they consume, emit, preserve, validate, or ignore structured attribution metadata.\n- Implementations MUST treat malformed structured fields as explicit validation outcomes.\n- Implementations MUST not treat structured-field support as a substitute for campaign query parameter handling.\n\n## Evidence Expectations\n\n- Structured field fixtures covering valid lists, dictionaries, items, parameters, and malformed inputs.\n- Parser or serializer output for each supported structured metadata field.\n- Validation report identifying consume, emit, preserve, validate, or ignore behavior.\n",
