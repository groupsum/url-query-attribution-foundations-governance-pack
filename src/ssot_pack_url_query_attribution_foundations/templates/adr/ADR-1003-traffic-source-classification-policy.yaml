  "body": "## Authority Sources\n\n- GA4 traffic-source dimensions, manual tagging, and auto-tagging\n- GA4 default channel group\n- Google Analytics: Collect campaign data with custom URLs\n\n## Context\n\n- Downstream analytics systems often classify visits or events into traffic sources and channel groups after campaign parameters are parsed.\n- Classification is a separate concern from URL parsing and campaign parameter recognition.\n- GA4 documentation provides commonly used traffic-source and default-channel classification targets.\n\n## Decision\n\n- This repository treats traffic-source and channel classification as governed attribution outputs derived from campaign, referrer, and request context.\n- GA4 traffic-source documentation is the authority for GA4 source, medium, campaign, and related manual-tagging mappings.\n- GA4 default channel group documentation is the authority for GA4 channel classification expectations.\n- Classification decisions must remain traceable to their classification authority and must not be presented as generic URL parsing requirements.\n\n## Exclusions\n\n- GA4 Measurement Protocol ingestion\n- GA4 BigQuery export schema\n- Ad platform bidding or conversion APIs\n- Cross-channel attribution modeling\n\n## Consequences\n\n- Implementations can expose classification features independently from raw parameter parsing features.\n- Implementations should keep source, medium, campaign, and channel evidence distinct enough to debug classification outcomes.\n- Tests should include representative source/medium pairs, campaign overrides, direct or unassigned cases, and classification changes caused by missing context.\n"
