  "decision": [
    "Well-known URIs and structured HTTP fields are support targets for attribution-related metadata discovery and machine-readable HTTP signals.",
    "They are not campaign parameter semantics authorities.",
    "This pack may define conformance targets for recognizing or emitting well-known resources and structured HTTP field values when attribution metadata uses those mechanisms."
  ],
  "consequences": [
    "RFC 8615 and RFC 8941 are governed as infrastructure targets.",
    "Conformance claims must state whether the implementation consumes, emits, validates, or only preserves such metadata.",
    "These targets stay independent from campaign query parameter semantics."
  ],
  "notes": [
    "This document was seeded from digital-analytics-customer-data-collection-sources.md.",
    "This pack intentionally does not refer to sibling governance packs."
  ]
}
