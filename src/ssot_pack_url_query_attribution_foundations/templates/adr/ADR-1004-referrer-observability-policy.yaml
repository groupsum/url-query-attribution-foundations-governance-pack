  "body": "## Authority Sources\n\n- W3C Referrer Policy\n- RFC 9110: HTTP Semantics\n- WHATWG Fetch\n- WHATWG HTML navigation and referrer integration\n\n## Context\n\n- Attribution systems often use referrer and request context to infer traffic origin when campaign parameters are absent or incomplete.\n- Browser and HTTP standards can reduce, suppress, or transform referrer information.\n- Downstream repositories need to treat missing or reduced referrer context as an expected observable state when standards or clients cause it.\n\n## Decision\n\n- This repository treats referrer information as attribution observability context, not as guaranteed attribution input.\n- Referrer policy is the authority for when referrer data is sent, reduced, or omitted.\n- HTTP, Fetch, and HTML navigation behavior define the request and navigation contexts in which referrer observations occur.\n- Implementations must distinguish observed absence or reduction of referrer data from parser or collector failure.\n\n## Exclusions\n\n- Browser-specific anti-tracking policy beyond cited standards\n- Consent authorization to collect referrer data\n- Full identity resolution\n- Advertising attribution APIs\n\n## Consequences\n\n- Implementations can record full referrer, origin-only referrer, reduced referrer, absent referrer, and intentionally suppressed referrer as different evidence states.\n- Implementations should not overwrite explicit campaign parameters solely because referrer context is present.\n- Tests should cover policy-driven suppression, cross-origin reduction, redirect or navigation effects, and absent-referrer fallback behavior.\n"
