  "summary": "This repository treats cookies and Web Storage as attribution state carriers when a downstream implementation chooses to persist attribution context.",
  "supersedes": [],
  "superseded_by": [],
  "status_notes": [],
  "references": [],
  "body": "## Authority Sources\n\n- RFC 6265: HTTP State Management Mechanism\n- draft-ietf-httpbis-rfc6265bis\n- Web Storage\n\n## Context\n\n- Campaign attribution often requires short-lived or session-scoped context to connect landing-page observations to later events.\n- Cookies and browser storage can carry attribution context, but their availability and behavior depend on web platform standards and user-agent policy.\n- Downstream repositories need a decision that governs state shape and observability without deciding whether collecting or storing that state is legally permitted.\n\n## Decision\n\n- This repository treats cookies and Web Storage as attribution state carriers when a downstream implementation chooses to persist attribution context.\n- RFC 6265 is the baseline authority for HTTP cookie syntax and behavior.\n- draft-ietf-httpbis-rfc6265bis is tracked as the modern cookie behavior authority for current cookie attributes and SameSite-sensitive behavior.\n- Web Storage is the authority for localStorage and sessionStorage attribution context when client-side storage is used.\n- State availability, absence, rejection, expiry, and clearing must be modeled as normal runtime outcomes.\n\n## Exclusions\n\n- Consent validity for writing or reading state\n- Privacy-law compliance determinations\n- Cross-device identity stitching\n- Opaque vendor identity graphs\n\n## Consequences\n\n- Implementations can test attribution continuity across requests or browser interactions where state is available.\n- Implementations must handle unavailable or cleared state without treating that outcome as nonconformance by itself.\n- Tests should cover cookie attributes, expiry, SameSite-sensitive cases, localStorage, sessionStorage, and disabled or unavailable storage.\n"
}
