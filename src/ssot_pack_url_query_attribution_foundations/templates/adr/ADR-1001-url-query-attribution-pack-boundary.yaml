  "decision": [
    "This pack governs attribution-relevant URL, query, referrer, request, cookie, storage, and campaign classification foundations.",
    "This pack does not govern full analytics platform behavior, consent policy, advertising supply chains, mobile install attribution, or downstream implementation claims.",
    "This pack treats URL and HTTP standards as syntax and transport authorities, and analytics vendor documents as attribution-semantic authorities.",
    "This pack must not refer to sibling governance packs."
  ],
  "consequences": [
    "The pack can define conformance targets for parsing, preservation, normalization, classification, and observability.",
    "The pack cannot claim conformance to complete analytics products or privacy regimes.",
    "Downstream repositories must create their own implementation features, tests, evidence, and release boundaries."
  ],
  "notes": [
    "This document was seeded from digital-analytics-customer-data-collection-sources.md.",
    "This pack intentionally does not refer to sibling governance packs."
  ]
