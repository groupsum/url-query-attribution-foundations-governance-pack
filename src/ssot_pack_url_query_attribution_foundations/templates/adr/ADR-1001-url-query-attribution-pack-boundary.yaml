      "Browser URL parsing behavior",
      "Campaign query parameter semantics",
      "Referrer and request-context observability",
      "Cookie and browser-storage attribution context",
      "HTTP caching effects on attribution observability",
      "Well-known URI and structured-field support surfaces",
      "GA4 traffic-source and default-channel classification as attribution classification targets"
    ],
    "excludes": [
      "Full GA4 event collection governance",
      "Consent and privacy signal precedence",
