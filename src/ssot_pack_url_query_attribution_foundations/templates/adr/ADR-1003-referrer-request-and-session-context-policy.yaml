  "decision": [
    "Referrer, request metadata, redirects, cookies, and client storage are governed as attribution observability context.",
    "This pack may define how these context sources are captured, normalized, retained, or intentionally absent.",
    "This pack must not define consent legality or privacy-signal precedence for using these context sources."
  ],
  "consequences": [
    "Missing referrer or cookie context can be a conformant outcome when source standards or user agents suppress it.",
    "Attribution systems must distinguish observed absence from parser failure.",
    "Downstream tests should cover preserved, transformed, and unavailable context states."
  ],
