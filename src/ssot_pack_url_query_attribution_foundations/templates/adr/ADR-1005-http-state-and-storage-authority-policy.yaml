{
  "id": "adr:http-state-and-storage-authority-policy",
  "number": 1005,
  "slug": "http-state-and-storage-authority-policy",
  "title": "HTTP State And Storage Authority Policy",
  "status": "accepted",
  "supersedes": [],
  "superseded_by": [],
  "pack": "pack:url-query-attribution-foundations",
  "scope": {
    "governs": [
      "Cookie presence and absence as attribution context",
      "Cookie attribute parsing relevant to attribution state",
      "SameSite-sensitive attribution/session behavior",
      "Session storage and local storage attribution context",
      "State continuity across navigation where allowed by source standards"
    ],
    "excludes": [
      "Consent to set or read cookies",
      "Browser-specific anti-tracking enforcement",
      "User identity resolution",
      "Cross-device identity stitching",
      "Sibling governance-pack references"
    ]
  },
  "authority_sources": [
    "RFC 6265 HTTP State Management Mechanism",
    "draft-ietf-httpbis-rfc6265bis",
    "Web Storage",
    "WHATWG HTML navigation/referrer integration"
  ],
  "decision": [
    "HTTP cookies and browser storage are governed as attribution state carriers.",
    "RFC 6265 is the baseline cookie authority.",
    "draft-ietf-httpbis-rfc6265bis is tracked as the modern cookie behavior authority for SameSite and current browser semantics.",
    "Web Storage is tracked as a client-side attribution context storage authority."
  ],
  "consequences": [
    "The pack can require tests for cookie/storage state shape and availability.",
    "The pack cannot claim that storing attribution state is legally allowed.",
    "Downstream implementations must handle state unavailability as a normal condition."
  ],
  "notes": [
    "This document was seeded from digital-analytics-customer-data-collection-sources.md.",
    "This pack intentionally does not refer to sibling governance packs."
  ]
}
